name: jobs-app

on:
  pull_request:
    paths:
      - 'jobs-app/**'
      - '.github/workflows/jobs-app.yml'
  push:
    branches: [main]
    paths:
      - 'jobs-app/**'
      - '.github/workflows/jobs-app.yml'

permissions:
  contents: read

concurrency:
  group: jobs-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Type-check, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: jobs-app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: jobs-app/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

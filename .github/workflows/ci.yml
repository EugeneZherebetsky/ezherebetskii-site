name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jobs-app:
    name: Type-check, test and build jobs-app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jobs-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: jobs-app/package-lock.json

      - run: npm ci

      - name: Unit tests
        run: npm test
        env:
          # Dummy values: the Supabase client module throws at import time
          # without them. No real project is contacted in unit tests.
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: test-publishable-key

      - name: Type-check and production build
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: test-publishable-key
